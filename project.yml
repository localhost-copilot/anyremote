name: AnyRemote
options:
  bundleIdPrefix: com.localhost-copilot
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  AnyRemoteKit:
    path: Packages/AnyRemoteKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: 63WUCGRSN3
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AnyRemote:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      # Copied into each generated Dock proxy bundle (DockProxies.swift).
      - target: AnyRemoteDockProxy
        embed: true
        copy:
          destination: executables
      # Installed into /Library/Audio/Plug-Ins/HAL from Settings (MicrophoneDriverInstaller.swift).
      - target: AnyRemoteMicrophone
        embed: true
        copy:
          destination: resources
      - package: AnyRemoteKit
        product: AnyRemoteWire
      - package: AnyRemoteKit
        product: AnyRemoteMedia
      - package: AnyRemoteKit
        product: AnyRemoteWindowControl
      - package: AnyRemoteKit
        product: AnyRemoteDiagnostics
      - package: AnyRemoteKit
        product: AnyRemoteNetwork
      - package: AnyRemoteKit
        product: AnyRemoteHost
      - package: AnyRemoteKit
        product: AnyRemoteClient
    entitlements:
      path: App/AnyRemote.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "15.0"
        NSLocalNetworkUsageDescription: AnyRemote finds and connects to other Macs on your network.
        NSBonjourServices:
          - _anyremote._tcp
        NSAppleEventsUsageDescription: AnyRemote opens Screen Sharing for full-desktop sessions.
        NSAudioCaptureUsageDescription: AnyRemote sends the sound of the apps another Mac shows to that Mac.
        NSMicrophoneUsageDescription: AnyRemote lets apps on the Mac you control hear you while they record.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localhost-copilot.anyremote
        MARKETING_VERSION: "0.17.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # A separate identity, so development builds don't take over the
        # installed app's privacy permissions (TCC keys them by bundle ID).
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.localhost-copilot.anyremote.dev
          PRODUCT_NAME: AnyRemote Dev
          # Orange, to tell it from the installed app in the Dock and privacy lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  AnyRemoteDockProxy:
    type: tool
    platform: macOS
    sources:
      - DockProxy
    settings:
      base:
        PRODUCT_NAME: AnyRemoteDockProxy
        SKIP_INSTALL: YES
  AnyRemoteMicrophone:
    # The AnyRemote Microphone, a Core Audio server plug-in (MicrophoneDriver/).
    type: bundle
    platform: macOS
    sources:
      - path: MicrophoneDriver
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: AnyRemote Microphone
        EXECUTABLE_NAME: AnyRemoteMicrophone
        PRODUCT_BUNDLE_IDENTIFIER: com.localhost-copilot.anyremote.microphone
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: MicrophoneDriver/Info.plist
        # The driver's own version: Settings offers to update an installed
        # driver only when this changes, not with every app release.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: -framework CoreAudio -framework CoreFoundation
